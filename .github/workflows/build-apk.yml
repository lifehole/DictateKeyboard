# Builds an installable debug APK on GitHub's servers and attaches it to the
# run as a downloadable artifact. Trigger it from the Actions tab ("Run
# workflow") or just push to any claude/** branch or main.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # The on-device speech libraries (sherpa-onnx) are pinned build artifacts
      # that are not committed to git; the build refuses to start without them.
      - name: Fetch vendored sherpa-onnx libraries
        run: bash tools/fetch-sherpa-onnx.sh

      # The on-device translation engine (Bergamot, issue #424) is compiled from
      # Mozilla's sources by tools/bergamot/build-android.sh and is not committed
      # either; the build refuses to start without it. Compiling it takes a
      # while, so the library is cached and only rebuilt when the build script
      # or the pinned NDK/CMake versions change. The save is its own step, right
      # after the build, so a later failure in the APK build cannot throw the
      # compiled library away.
      - name: Restore the cached Bergamot library
        id: bergamot-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so
          key: bergamot-${{ runner.os }}-${{ hashFiles('tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Install the NDK and CMake the Bergamot build needs
        if: steps.bergamot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK="$(sed -nE 's/^ndk = "(.*)"/\1/p' gradle/tools.versions.toml)"
          CMAKE="$(sed -nE 's/^cmake = "(.*)"/\1/p' gradle/tools.versions.toml)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" --install "ndk;$NDK"
          (yes || true) | "$SDKMANAGER" --install "cmake;$CMAKE" || true
          # The SDK manager does not carry every CMake release; the runner's own
          # CMake and Ninja build the library just as well.
          if [ ! -x "$ANDROID_HOME/cmake/$CMAKE/bin/cmake" ]; then
            mkdir -p "$ANDROID_HOME/cmake/$CMAKE/bin"
            ln -sf "$(command -v cmake)" "$ANDROID_HOME/cmake/$CMAKE/bin/cmake"
            ln -sf "$(command -v ninja)" "$ANDROID_HOME/cmake/$CMAKE/bin/ninja"
          fi
          "$ANDROID_HOME/cmake/$CMAKE/bin/cmake" --version | head -1
          ls "$ANDROID_HOME/ndk/$NDK/build/cmake/android.toolchain.cmake"

      - name: Build the Bergamot library
        if: steps.bergamot-cache.outputs.cache-hit != 'true'
        run: bash tools/bergamot/build-android.sh

      - name: Save the Bergamot library to the cache
        if: steps.bergamot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so
          key: bergamot-${{ runner.os }}-${{ hashFiles('tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
